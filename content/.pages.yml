<script>
  fetch('/content/news.json')
    .then(response => response.json())
    .then(newsList => {
      const container = document.getElementById('news-container');
      newsList.forEach(item => {
        container.innerHTML += `
          <div class="news-item">
            <h3>${item.title}</h3>
            <small>${item.date}</small>
            <p>${item.body}</p>
          </div>
        `;
      });
    });
</script>
